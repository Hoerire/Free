name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# 并发取消当前关闭：每个推送都独立排队构建。
# 开启时同分支只保留最新一次构建，代价是取消接口异常会让后续提交一起排队。
# concurrency:
#   group: build-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 依赖 + wrapper + Kotlin 编译缓存，命中时构建从 4 分钟降到 1 分钟左右。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.kotlin
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      # 单元测试是契约门禁：失败即挡住出包。任务名在 AGP 9 下是 testDebugUnitTest，
      # 不存在 testReleaseUnitTest，因此不再做任务名探测。
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --stacktrace

      - name: Show output
        run: ls -l app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Free-apk
          path: app/build/outputs/apk/release/*.apk
